[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiaun-mcp"
version = "0.1.0"
description = "Local-light MCP orchestrator for Kaggle experiments"
requires-python = ">=3.10"
dependencies = [
  "mcp>=2.1.0",
  "kaggle>=1.6.0",
  "python-dotenv>=1.0.0",
  "google-api-python-client>=2.100.0",
  "google-auth>=2.23.0",
  "google-auth-oauthlib>=1.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
aiaun-mcp = "aiaun_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: hits Kaggle/Drive network; requires AIAUN_LIVE_TEST=1",
]
pythonpath = ["src"]
